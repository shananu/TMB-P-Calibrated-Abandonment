[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolmisusebench"
version = "0.1.0"
description = "Deterministic benchmark for tool misuse and recovery"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ToolMisuseBench Authors" }]
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
toolmisusebench = "toolmisusebench.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["toolmisusebench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
